    <!-- Apply the saved theme (dark or darker) before first paint, so it never flashes. Dark is the default. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "darker") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
        if (t === "darker") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#06080f");
      })();
    </script>

    <!-- First-load intro: a fixed layer over the page that never takes clicks, then lifts away.
         Any key, click, scroll or touch ends it early. Skipped for reduced motion and after the
         first view this session. The page underneath is already rendered and in the DOM. -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: #101416;
        color: #eef1ee;
        animation: intro-out 0.5s cubic-bezier(0.7, 0, 0.2, 1) 1.05s forwards;
      }
      [data-theme="darker"] #intro { background: #06080f; }
      #intro.is-skip { animation-duration: 0.22s; animation-delay: 0s; }
      .intro-in { display: grid; justify-items: center; gap: 18px; padding: 0 24px; text-align: center; }
      .intro-mark { width: 72px; height: 72px; animation: intro-mark 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .intro-dot { opacity: 0; animation: intro-dot 0.32s steps(2, jump-none) 0.38s forwards; }
      .intro-name {
        margin: 0;
        font: 720 clamp(2rem, 6vw, 3.6rem) / 1 "Archivo Variable", system-ui, sans-serif;
        font-stretch: 116%;
        letter-spacing: -0.03em;
        clip-path: inset(0 100% 0 0);
        animation: intro-wipe 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
      }
      .intro-role {
        margin: 0;
        opacity: 0;
        font: 450 0.9rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
        color: #b2bcbc;
        animation: intro-fade 0.4s ease-out 0.5s forwards;
      }
      @keyframes intro-mark { from { opacity: 0; transform: scale(0.72); } }
      @keyframes intro-dot { to { opacity: 1; } }
      @keyframes intro-wipe { to { clip-path: inset(0 0 0 0); } }
      @keyframes intro-fade { to { opacity: 1; } }
      @keyframes intro-out { to { clip-path: inset(0 0 100% 0); visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
    </style>

    <script>
      (function () {
        var el = document.getElementById("intro");
        var seen;
        try { seen = sessionStorage.getItem("intro"); } catch (e) {}
        if (seen || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) { el.remove(); return; }
        try { sessionStorage.setItem("intro", "1"); } catch (e) {}
        var events = ["pointerdown", "keydown", "wheel", "touchstart"];
        var off = function () { events.forEach(function (n) { removeEventListener(n, skip, true); }); };
        var done = function () { off(); el.remove(); };
        var skip = function () { el.classList.add("is-skip"); off(); setTimeout(done, 260); };
        // The timer is the guarantee: even if animations are throttled, the layer is gone by 1.7s.
        setTimeout(done, 1700);
        events.forEach(function (n) { addEventListener(n, skip, { capture: true, passive: true }); });
        el.addEventListener("animationend", function (e) {
          if (e.animationName === "intro-out") done();
        });
      })();
    </script>
