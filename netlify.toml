[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

# Security headers for every page and file.
# The two script hashes allow the inline scripts in index.html (the
# no-flash theme script and the intro script). Change one of those scripts
# and its hash changes too: `npm test` (netlify/headers.test.js) fails and prints the new value.
# The JSON-LD block is data, not script, so it needs no hash.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-7zAaWdYztBgTL7owuj02P7LnTdTk0rLl8TOSr2HSvYI=' 'sha256-xCZ1QnGcjHu1cCiAiRRSAXzi6WSjdduwHTE+ikUcspw='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
